{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-6">
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-800">
                {% if user %}Editar Usuario{% else %}Crear Usuario{% endif %}
            </h1>
            <p class="text-gray-600 mt-2">
                {% if user %}Modifica los datos del usuario{% else %}Ingresa los datos para crear un nuevo usuario{%
                endif %}
            </p>
        </div>

        <form method="post" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Nombre de Usuario</label>
                <input type="text" id="username" name="username" value="{{ user.username if user else '' }}" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                    Contraseña
                    {% if user %}<span class="text-gray-500">(Deja vacío para mantener la actual)</span>{% endif %}
                </label>
                <input type="password" id="password" name="password" {% if not user %}required{% endif %}
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            {% if isSuperAdmin %}
            <div>
                <label for="role_id" class="block text-sm font-medium text-gray-700 mb-2">Rol</label>
                <select id="role_id" name="role_id" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    {% for role in roles %}
                    <option value="{{ role.id }}" {{ 'selected' if user and user.role_id==role.id else '' }}>
                        {{ role.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}

            <div class="flex justify-end space-x-3">
                <a href="{{ url_for('admin.manage_users') }}"
                    class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-500 transition duration-300">
                    Cancelar
                </a>
                <button type="submit"
                    class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-300">
                    <i class="fas fa-save mr-2"></i>
                    {% if user %}Actualizar{% else %}Crear{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
